name: 更新CF优选IP

on:
  schedule:
    # 北京时间 07:30 / 12:30 / 19:30
    - cron: '30 23 * * *'
    - cron: '30 4 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cf-select
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行优选脚本
        run: python scripts/bestcf.py

      - name: 提交更新
        run: |
          git config user.name "cf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ip.txt ip_all.txt backup.txt meta.json log.txt
          # meta.json 内含每次运行时间戳，必定产生 diff，因此必定 commit
          # 这同时解决了公共仓库 60 天无提交被暂停定时任务的问题
          git diff --cached --quiet || (git commit -m "优选更新 $(TZ=Asia/Shanghai date +'%F %R')" && git push)
